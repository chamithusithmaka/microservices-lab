version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - item-service
      - order-service
      - payment-service

  item-service:
    build: ./ItemService
    ports:
      - "8081:8081"

  order-service:
    build: ./OrderService
    ports:
      - "8082:8082"

  payment-service:
    build: ./PaymentService
    ports:
      - "8083:8083"
